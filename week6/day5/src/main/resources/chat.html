<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 30 · Local LLM Chat</title>
<style>
  :root {
    --bg:#0f1115; --panel:#1a1d24; --border:#2b2f38; --text:#e5e7eb;
    --muted:#9ca3af; --accent:#4f8cff; --user:#2a3244; --bot:#141922;
    --err:#dc2626; --ok:#22c55e; --warn:#f59e0b;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; font-size:15px; }
  body { display:flex; flex-direction:column; height:100vh; }
  header { padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--border);
    display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { margin:0; font-size:16px; font-weight:600; }
  header .status { font-size:12px; color:var(--muted); }
  header .status.ok { color:var(--ok); }
  header .status.err { color:var(--err); }
  .settings { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .settings label { font-size:12px; color:var(--muted); }
  input[type=text], input[type=password] {
    background:var(--bg); color:var(--text); border:1px solid var(--border);
    padding:6px 10px; border-radius:6px; font-size:13px; min-width:120px;
  }
  select { background:var(--bg); color:var(--text); border:1px solid var(--border);
    padding:6px 10px; border-radius:6px; font-size:13px; }
  #messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:min(720px,90%); padding:10px 14px; border-radius:10px; line-height:1.5;
    white-space:pre-wrap; word-wrap:break-word; }
  .msg.user { background:var(--user); align-self:flex-end; }
  .msg.bot { background:var(--bot); border:1px solid var(--border); align-self:flex-start; }
  .msg.error { background:#3f1a1a; border:1px solid var(--err); color:#fca5a5; align-self:flex-start; }
  .msg .meta { font-size:11px; color:var(--muted); margin-top:6px; display:flex; gap:12px; flex-wrap:wrap; }
  .msg .sources { margin-top:8px; font-size:12px; color:var(--muted); padding-top:8px; border-top:1px dashed var(--border); }
  .msg .sources li { margin-bottom:2px; }
  footer { padding:12px 16px; background:var(--panel); border-top:1px solid var(--border);
    display:flex; gap:8px; align-items:flex-end; }
  textarea { flex:1; background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:10px; font-size:15px; font-family:inherit; resize:none;
    min-height:44px; max-height:200px; }
  button { background:var(--accent); color:#fff; border:none; border-radius:8px;
    padding:0 16px; height:44px; font-size:14px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:wait; }
  .hint { font-size:11px; color:var(--muted); padding:4px 16px; background:var(--panel); }
</style>
</head>
<body>

<header>
  <h1>💬 Day 30 · Local LLM</h1>
  <span id="status" class="status">…</span>
  <div class="settings" style="margin-left:auto">
    <label>Режим:</label>
    <select id="mode">
      <option value="rag">RAG (по докам)</option>
      <option value="chat">Chat (свободный)</option>
    </select>
    <label>API ключ:</label>
    <input type="password" id="apikey" placeholder="demo-2026" autocomplete="off">
  </div>
</header>

<div id="messages"></div>

<div class="hint">Shift+Enter — новая строка · Enter — отправить · Ключ хранится в вашем браузере (localStorage)</div>

<footer>
  <textarea id="input" placeholder="Задай вопрос…" rows="1"></textarea>
  <button id="send">Отправить</button>
</footer>

<script>
const $ = id => document.getElementById(id);
const messages = $('messages'), input = $('input'), send = $('send'),
      apikey = $('apikey'), mode = $('mode'), status = $('status');

// Load persisted settings
apikey.value = localStorage.getItem('llm_api_key') || '';
mode.value   = localStorage.getItem('llm_mode') || 'rag';
apikey.addEventListener('change', () => localStorage.setItem('llm_api_key', apikey.value));
mode.addEventListener('change',   () => localStorage.setItem('llm_mode', mode.value));

// Auto-grow textarea
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(200, input.scrollHeight) + 'px';
});

// Enter to send, Shift+Enter for newline
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    doSend();
  }
});

send.addEventListener('click', doSend);

async function checkHealth() {
  try {
    const r = await fetch('/health');
    const j = await r.json();
    if (j.status === 'ok' && j.ollama) {
      status.textContent = `✓ ${j.model} · index: ${j.index_chunks} chunks`;
      status.className = 'status ok';
    } else {
      status.textContent = '⚠ ollama down';
      status.className = 'status err';
    }
  } catch (e) {
    status.textContent = '⚠ health failed';
    status.className = 'status err';
  }
}
checkHealth();

// Chat history for /v1/chat mode
const chatHistory = [];

function addMessage(role, text, meta) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const bodyDiv = document.createElement('div');
  bodyDiv.textContent = text;
  div.appendChild(bodyDiv);

  if (meta) {
    if (meta.sources && meta.sources.length) {
      const s = document.createElement('div');
      s.className = 'sources';
      s.innerHTML = '<b>Источники:</b><ul>' +
        meta.sources.map(x => `<li>${x.marker} ${x.source} (sim=${x.similarity})</li>`).join('') +
        '</ul>';
      div.appendChild(s);
    }
    const m = document.createElement('div');
    m.className = 'meta';
    const parts = [];
    if (meta.wall_ms != null) parts.push(`wall: ${meta.wall_ms} ms`);
    if (meta.eval_ms != null && meta.eval_ms > 0) parts.push(`eval: ${meta.eval_ms} ms`);
    if (meta.tokens_out != null) parts.push(`tokens: ${meta.tokens_out}`);
    if (parts.length) { m.textContent = parts.join(' · '); div.appendChild(m); }
  }

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

async function doSend() {
  const text = input.value.trim();
  if (!text) return;

  addMessage('user', text);
  input.value = '';
  input.style.height = 'auto';

  send.disabled = true;
  const thinking = addMessage('bot', '…думаю');

  try {
    let url, body;
    if (mode.value === 'rag') {
      url  = '/v1/rag';
      body = { question: text, k: 3 };
    } else {
      chatHistory.push({ role: 'user', content: text });
      url  = '/v1/chat';
      body = { messages: chatHistory, max_tokens: 512 };
    }

    const headers = { 'Content-Type': 'application/json' };
    if (apikey.value.trim()) headers['X-API-Key'] = apikey.value.trim();

    const r = await fetch(url, {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
    });

    const j = await r.json();
    thinking.remove();

    if (!r.ok) {
      const errMsg = j.error ? `${r.status} ${j.error.type}: ${j.error.message}`
                             : `HTTP ${r.status}`;
      addMessage('error', errMsg);
      if (mode.value === 'chat') chatHistory.pop(); // откатываем user msg
      return;
    }

    const answer = j.answer || '(пустой ответ)';
    addMessage('bot', answer, j);
    if (mode.value === 'chat') {
      chatHistory.push({ role: 'assistant', content: answer });
    }
  } catch (e) {
    thinking.remove();
    addMessage('error', 'Сеть: ' + (e.message || e));
    if (mode.value === 'chat') chatHistory.pop();
  } finally {
    send.disabled = false;
    input.focus();
  }
}

// Refresh health every 30s
setInterval(checkHealth, 30000);
</script>
</body>
</html>
